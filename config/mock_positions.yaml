# 模拟盘初始持仓配置 (兜底剧本)
# 启动 / 重置持仓时: 优先同步大 QMT 账户快照 (file_bridge);
# 没有可用快照时, 才按本文件 mock 持仓 (让 dashboard 一开始就有数据看)
# 修改本文件后, 需在无快照或快照不可用时点「重置持仓」才会生效
#
# 当前剧本: 假设 2026-04-01 用 100 万资金, 5 只票各分配 ~19 万,
# 按当日开盘价买入 (整手 100 股), 剩余约 12.7 万现金留作加仓 / 抄底
# cost = 2026-04-01 开盘价 (从 MySQL trade_stock_daily 取)

# 总资金 (元)
capital: 1000000

# 初始持仓清单
positions:
  - code: 600519.SH
    name: 贵州茅台
    volume: 100         # 14.6 万
    cost: 1464.49       # 2026-04-01 开盘

  - code: 688981.SH
    name: 中芯国际
    volume: 1900        # 18.3 万
    cost: 96.40

  - code: 300750.SZ
    name: 宁德时代
    volume: 400         # 16.4 万
    cost: 409.73

  - code: 513100.SH
    name: 纳指ETF
    volume: 110000      # 18.9 万 (ETF 100 整手, 价格小所以股数多)
    cost: 1.72

  - code: 000001.SZ
    name: 平安银行
    volume: 17100       # 19.0 万
